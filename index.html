<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11100e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dailies">
<title>Dailies</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="proj-btn" id="projBtn" aria-label="Switch project"><span id="projName">Dailies</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="streak" id="streak" title="Days in a row"></div>
  </header>
  <div class="sprockets" aria-hidden="true"></div>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Add today's second"><span></span></button>
  <nav class="tabs" id="tabs">
    <button data-tab="days" class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Days</button>
    <button data-tab="mash"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z" class="fill"/></svg>Mash</button>
    <button data-tab="projects"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Projects</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Settings</button>
  </nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status"></div>
<div id="pool" aria-hidden="true"></div>
<input type="file" id="filePick" accept="video/*,image/*" hidden>
<input type="file" id="multiPick" accept="video/*,image/*" multiple hidden>
<input type="file" id="packPick" accept=".dailies,.dpack,application/octet-stream" hidden>
<input type="file" id="musicPick" accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
